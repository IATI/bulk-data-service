name: "aci-#APP_NAME#-#TARGET_ENVIRONMENT#"
apiVersion: "2021-10-01"
location: "uksouth"
properties: # Properties of container group
  imageRegistryCredentials: # Credentials to pull a private image
    - server: "#ACR_LOGIN_SERVER#"
      username: "#ACR_USERNAME#"
      password: "#ACR_PASSWORD#"
  restartPolicy: "Never"
  osType: "Linux"
  diagnostics:
    logAnalytics:
      workspaceId: "#LOG_WORKSPACE_ID#"
      workspaceKey: "#LOG_WORKSPACE_KEY#"
  containers:
    - name: "#APP_NAME#-#TARGET_ENVIRONMENT#"
      properties: # Properties of an instance
        resources: # Resource requirements of the instance
          requests:
            memoryInGB: 6
            cpu: 1.5
        image: "#ACR_LOGIN_SERVER#/#APP_NAME#-#TARGET_ENVIRONMENT#:#DOCKER_IMAGE_TAG#"
        ports:
          - port: 9090
        command:
          - "/usr/local/bin/python"
          - "src/iati_bulk_data_service.py"
          - "--operation"
          - "checker"
        environmentVariables:
          - name: DATA_REGISTRATION
            value: "#DATA_REGISTRATION#"
          - name: DATA_REGISTRY_BASE_URL
            value: "#DATA_REGISTRY_BASE_URL#"
          - name: DATA_REGISTRY_PUBLISHER_PLAIN_LIST_URL
            value: "#DATA_REGISTRY_PUBLISHER_PLAIN_LIST_URL#"
          - name: DATA_REGISTRY_PUBLISHER_METADATA_URL
            value: "#DATA_REGISTRY_PUBLISHER_METADATA_URL#"
          - name: DATA_REGISTRY_PUBLISHER_METADATA_BATCH_SIZE
            value: "#DATA_REGISTRY_PUBLISHER_METADATA_BATCH_SIZE#"
          - name: DATA_REGISTRY_SUITECRM_API_URL
            value: "#DATA_REGISTRY_SUITECRM_API_URL#"
          - name: DATA_REGISTRY_SUITECRM_SECURE
            value: "#DATA_REGISTRY_SUITECRM_SECURE#"
          - name: WEB_BASE_URL
            value: "#WEB_BASE_URL#"
          - name: CHECKER_LOOP_WAIT_MINS
            value: "#CHECKER_LOOP_WAIT_MINS#"
          - name: NUMBER_DOWNLOADER_THREADS
            value: "#NUMBER_DOWNLOADER_THREADS#"
          - name: FORCE_REDOWNLOAD_AFTER_HOURS
            value: "#FORCE_REDOWNLOAD_AFTER_HOURS#"
          - name: REMOVE_LAST_GOOD_DOWNLOAD_AFTER_FAILING_HOURS
            value: "#REMOVE_LAST_GOOD_DOWNLOAD_AFTER_FAILING_HOURS#"
          - name: ZIP_WORKING_DIR
            value: "#ZIP_WORKING_DIR#"
          - name: AZURE_STORAGE_BLOB_CONTAINER_NAME
            value: "#AZURE_STORAGE_BLOB_CONTAINER_NAME#"
          - name: AZURE_SERVICE_BUS_REGISTRY_TOPIC_NAME
            value: "#AZURE_SERVICE_BUS_REGISTRY_TOPIC_NAME#"
          - name: AZURE_SERVICE_BUS_REGISTRY_SUB_NAME
            value: "#AZURE_SERVICE_BUS_REGISTRY_SUB_NAME#"
          - name: AZURE_SERVICE_BUS_DATASET_CHECK_RESULTS_TOPIC_NAME
            value: "#AZURE_SERVICE_BUS_DATASET_CHECK_RESULTS_TOPIC_NAME#"
          - name: AZURE_SERVICE_BUS_WAIT_TIME
            value: "#AZURE_SERVICE_BUS_WAIT_TIME#"
          - name: REDOWNLOAD_FROM_NON_HEAD_SERVERS_AFTER_HOURS
            value: "#REDOWNLOAD_FROM_NON_HEAD_SERVERS_AFTER_HOURS#"
          - name: DATASET_HEAD_TIMEOUT
            value: "#DATASET_HEAD_TIMEOUT#"
          - name: DATASET_GET_TIMEOUT
            value: "#DATASET_GET_TIMEOUT#"
          - name: SEND_DATASET_CHECK_RESULT_MESSAGES
            value: "#SEND_DATASET_CHECK_RESULT_MESSAGES#"

          - name: AZURE_STORAGE_CONNECTION_STRING
            secureValue: "#AZURE_STORAGE_CONNECTION_STRING#"
          - name: DATA_REGISTRY_SUITECRM_CLIENT_ID
            secureValue: "#DATA_REGISTRY_SUITECRM_CLIENT_ID#"
          - name: DATA_REGISTRY_SUITECRM_CLIENT_SECRET
            secureValue: "#DATA_REGISTRY_SUITECRM_CLIENT_SECRET#"
          - name: DB_HOST
            secureValue: "#DB_HOST#"
          - name: DB_PORT
            secureValue: "#DB_PORT#"
          - name: DB_USER
            secureValue: "#DB_USER#"
          - name: DB_PASS
            secureValue: "#DB_PASS#"
          - name: DB_NAME
            secureValue: "#DB_NAME#"
          - name: DB_SSL_MODE
            secureValue: "#DB_SSL_MODE#"
          - name: DB_CONNECTION_TIMEOUT
            secureValue: "#DB_CONNECTION_TIMEOUT#"
          - name: AZURE_SERVICE_BUS_CONNECTION_STRING
            secureValue: "#AZURE_SERVICE_BUS_CONNECTION_STRING#"
    - name: nginx-proxy-for-prometheus
      properties:
        image: "#ACR_LOGIN_SERVER#/bds-prom-nginx-reverse-proxy-#TARGET_ENVIRONMENT#:#DOCKER_IMAGE_TAG#"
        ports:
          - port: 9158
            protocol: TCP
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 0.5
  ipAddress:
    type: "public"
    dnsNameLabel: "#APP_NAME#-#TARGET_ENVIRONMENT#"
    ports:
      - port: 9158
