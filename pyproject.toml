[project]
name = "bulk-data-service"
version = "1.2.0"
requires-python = ">= 3.12.6"
readme = "README.md"
dependencies = [
    "asyncio",
    "azure-storage-blob",
    "psycopg[binary,pool]",
    "requests",
    "yoyo-migrations",
    "prometheus-client",
    "toml",
    "chardet",
    "azure-servicebus"
]


[project.optional-dependencies]
dev = [
    "pip-tools",
    "isort",
    "mypy",
    "pytest",
    "black",
    "flake8",
    "flake8-pyproject",
    "types-requests",
    "python-dotenv",
    "pytest-watcher",
    "types-toml",
    "pytest-asyncio",
]


[tool.pip-tools]
strip-extras = true


[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = [
    "--import-mode=importlib"
]
pythonpath = [
  "src", "tests"
]
filterwarnings = [
    "ignore::DeprecationWarning:yoyo.*:",  # ignore deprecations from all modules
    "ignore::DeprecationWarning:yoyo.*:",  # ignore deprecations from all modules
    "default::DeprecationWarning:bulk_data_service.*:",  # except the app
]


[tool.isort]
py_version=312
extend_skip = ['__pycache__', '.mypy_cache', '.ve', '.venv', '.vagrant-ve']
skip_gitignore = true
src_paths = ['src', 'tests']
line_length = 119
profile = "black"


[tool.mypy]
files=["src/"]
mypy_path=["tests/"]


[tool.flake8]
max-line-length = 119
extend_ignore = ['E203', 'W503', 'E275']
exclude = ['__pycache__', '.mypy_cache', '.pytest_cache', '.ve', '.venv', '.vagrant-ve']
max_complexity = 7


[tool.black]
line-length = 119
target-version = ['py312']
include='''src/.*/*.py$'''
