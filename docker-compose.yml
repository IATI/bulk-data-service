---
services:
  bds-local-dev-azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    command: |
      azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 \
              --queuePort 10001 --tableHost 0.0.0.0 --tablePort 10002 \
              --location /data --loose --skipApiVersionCheck
    volumes:
      - iati-bulk-data-service-azurite:/data
    networks:
      bds-local-dev-net:

  bds-local-dev-db:
    image: postgres:15
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - PGPORT=${DB_PORT}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - iati-bulk-data-service-postgres:/var/lib/postgresql/data
    networks:
      bds-local-dev-net:

  bds-local-dev-mockoon:
    image: mockoon/cli:9.1.0
    ports:
      - 1443:1443
    volumes:
      - type: bind
        source: tests-local-environment/mockoon-suitecrm-registration-and-data-server-config.json
        target: /server-config.json
      - type: bind
        source: tests/artifacts
        target: /tests/artifacts
        read_only: true
    command: ["--data", "server-config.json", "-p", "1443"]
    healthcheck:
      test: curl -k -s -o /dev/null 'https://localhost:1443/data/test_foundation_a-dataset-001.xml'
      interval: 10s
      timeout: 10s
      retries: 1
    networks:
      bds-local-dev-net:

  bds-local-dev-mq-emulator:
    # NOTE: The emulator version is pinned deliberately; see the note in
    #       tests-local-environment/docker-compose.yml for why.
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    volumes:
      # NOTE: The local dev docker compose environment and the local test docker
      #       compose environment use the same Azure Service Bus configuration
      #       file; the different environments determine the correct instance to
      #       connect to because the local dev and test environments use a
      #       different set of ports.
      - "./tests-local-environment/service-bus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: bds-local-dev-mq-db
      MSSQL_SA_PASSWORD: "${AZURE_SERVICE_BUS_DB_PASS}"
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: 3
    depends_on:
      bds-local-dev-mq-db:
        condition: service_healthy
    networks:
      bds-local-dev-net:
        aliases:
          - bds-local-dev-mq-emulator

  bds-local-dev-mq-db:
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${AZURE_SERVICE_BUS_DB_PASS}"
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1''']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      bds-local-dev-net:
        aliases:
          - bds-local-dev-mq-db

networks:
  bds-local-dev-net:

volumes:
  iati-bulk-data-service-azurite:
    driver: local
  iati-bulk-data-service-postgres:
    driver: local
